name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify tag and app version match
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $APP_VERSION"
            exit 1
          fi

      - name: Run checks
        run: make test

      - name: Build ad-hoc signed Universal 2 release
        run: make release

      - name: Verify signed archive
        shell: bash
        run: |
          APP="dist/Benri.app"
          ZIP="dist/Benri-v${GITHUB_REF_NAME#v}-macOS-universal.zip"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Benri")"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          test -f "$ZIP"

      - name: Verify release artifact
        shell: bash
        run: |
          APP="dist/Benri.app"
          ZIP="dist/Benri-v${GITHUB_REF_NAME#v}-macOS-universal.zip"
          codesign --verify --deep --strict --verbose=2 "$APP"
          shasum -a 256 "$ZIP"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ASSET="dist/Benri-v${GITHUB_REF_NAME#v}-macOS-universal.zip"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          elif [[ -f "$NOTES" ]]; then
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --verify-tag \
              --title "Benri $GITHUB_REF_NAME" \
              --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --verify-tag \
              --title "Benri $GITHUB_REF_NAME" \
              --generate-notes
          fi
