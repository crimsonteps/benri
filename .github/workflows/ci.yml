name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run checks
        run: make test

      - name: Build app bundle
        run: make app

      - name: Verify app bundle
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Benri.app
          file dist/Benri.app/Contents/MacOS/Benri
          SOURCE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Benri.app/Contents/Info.plist)"
          BUNDLE_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Benri.app/Contents/Info.plist)"
          [[ "$SOURCE_VERSION" == "$APP_VERSION" ]]
          [[ "$BUNDLE_IDENTIFIER" == "com.crimsonteps.benri" ]]
